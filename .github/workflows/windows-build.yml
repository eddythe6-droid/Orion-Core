name: Windows EXE build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Orion-Core and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install .
          python -m pip install pyinstaller

      - name: Build standalone GUI executable
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onefile
          --windowed
          --name Orion-Core
          --paths src
          --collect-submodules orion_core
          src/orion_core/gui.py

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = Resolve-Path "dist/Orion-Core.exe"
          if ((Get-Item $exe).Length -lt 1000000) {
            throw "Executable is unexpectedly small."
          }
          Get-Item $exe | Select-Object Name, Length, FullName

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: Orion-Core-Windows-x64
          path: dist/Orion-Core.exe
          if-no-files-found: error
          retention-days: 30
