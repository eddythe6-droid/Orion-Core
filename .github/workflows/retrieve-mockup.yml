name: Retrieve UI mockup image

on:
  push:
    paths:
      - "8723911b-463f-48d2-b591-05782f482b81.png"
      - ".github/workflows/retrieve-mockup.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-image:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Package mockup image
        run: |
          test -s "8723911b-463f-48d2-b591-05782f482b81.png"
          file "8723911b-463f-48d2-b591-05782f482b81.png"
          mkdir -p dist
          cp "8723911b-463f-48d2-b591-05782f482b81.png" dist/Orion-Core-UI-Mockup.png
      - name: Upload mockup image
        uses: actions/upload-artifact@v4
        with:
          name: Orion-Core-UI-Mockup
          path: dist/Orion-Core-UI-Mockup.png
          if-no-files-found: error
          retention-days: 7
