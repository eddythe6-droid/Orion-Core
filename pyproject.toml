[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "orion-core"
version = "0.1.0"
description = "Read-only system diagnostics and compatibility research toolkit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
orion-core = "orion_core.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
